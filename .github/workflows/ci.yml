name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the run in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Matches `engines.node` in package.json. The server uses Node APIs
          # that only landed in 26.
          node-version: 26
          cache: pnpm

      - name: Install
        # --frozen-lockfile fails rather than resolving anything new. pnpm 11
        # still checks every locked version against minimumReleaseAge, so a
        # release too new to trust fails here just as it does locally.
        run: pnpm install --frozen-lockfile

      - name: Check
        # types, tests, lint and formatting — the same command used locally.
        run: pnpm check
