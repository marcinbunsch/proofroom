packages:
  - "packages/*"

# Pin exact versions on install: Effect 4 moves fast, and upgrades are planned
# work. pnpm 11 reads this here only; in .npmrc it is silently ignored.
saveExact: true

# Supply-chain guard: never install a dependency version published less than this
# many minutes ago (4320 = 3 days). A compromised release that is caught and
# yanked within a few days never makes it into the lockfile. pnpm 11 also checks
# every entry already in the lockfile on each install.
minimumReleaseAge: 4320

# esbuild fetches its platform binary. SQLite is Node's built-in node:sqlite, so
# there is no native addon to build.
allowBuilds:
  esbuild: true
